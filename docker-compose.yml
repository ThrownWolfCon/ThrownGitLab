services:
  tiddlywiki:
    image: node:22-alpine
    container_name: ThrownGitLab
    user: node
    working_dir: /wiki
    ports:
      - "1986:8080"
    volumes:
      - .:/wiki
    command: ["npx", "-y", "tiddlywiki@5.4.1", ".", "--listen", "host=0.0.0.0", "port=8080"]
    restart: unless-stopped